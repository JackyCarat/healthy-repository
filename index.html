<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日总能量消耗计算器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 激活码锁定界面 -->
    <div id="activation-overlay" class="overlay">
        <div class="activation-card">
            <h1>每日总能量消耗计算器</h1>
            <p class="subtitle">请输入激活码以使用本工具</p>
            <div class="input-group">
                <input type="text" id="activation-code" placeholder="请输入激活码" maxlength="8">
                <button id="activate-btn">激活</button>
            </div>
            <p id="activation-error" class="error-message"></p>
        </div>
    </div>

    <!-- 主内容区域 -->
    <div id="main-content" class="container hidden">
        <header>
            <h1>每日总能量消耗计算器</h1>
            <p class="activated-badge">✓ 已激活</p>
        </header>

        <main>
            <section class="form-section">
                <h2>基本信息</h2>
                <form id="tdee-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="age">年龄</label>
                            <input type="number" id="age" min="1" max="120" placeholder="请输入年龄" required>
                        </div>
                        <div class="form-group">
                            <label for="gender">性别</label>
                            <select id="gender" required>
                                <option value="">请选择</option>
                                <option value="male">男</option>
                                <option value="female">女</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="height">身高 (厘米)</label>
                            <input type="number" id="height" min="50" max="250" placeholder="请输入身高" required>
                        </div>
                        <div class="form-group">
                            <label for="weight">体重 (公斤)</label>
                            <input type="number" id="weight" min="10" max="300" step="0.1" placeholder="请输入体重" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="activity-level">活动水平</label>
                        <select id="activity-level" required>
                            <option value="">请选择</option>
                            <option value="1.2">久坐 — 几乎不运动，办公室工作为主</option>
                            <option value="1.375">轻度活动 — 每周运动1-3次</option>
                            <option value="1.55">中度活动 — 每周运动3-5次</option>
                            <option value="1.725">高度活动 — 每周运动6-7次</option>
                            <option value="1.9">极高活动 — 体力劳动或每天高强度训练</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="formula">BMR计算公式</label>
                        <select id="formula" required>
                            <option value="">请选择</option>
                            <option value="mifflin">Mifflin-St Jeor 公式（推荐，更准确）</option>
                            <option value="harris">Harris-Benedict 公式（经典）</option>
                        </select>
                    </div>

                    <button type="submit" class="calculate-btn">计算</button>
                </form>
            </section>

            <section id="result-section" class="result-section hidden">
                <h2>计算结果</h2>
                <div class="result-card">
                    <div class="result-main">
                        <span class="result-label">每日总能量消耗 (TDEE)</span>
                        <span class="result-value" id="tdee-result">0</span>
                        <span class="result-unit">卡路里/天</span>
                    </div>
                </div>

                <div class="calculation-process">
                    <h3>计算过程</h3>
                    <div id="process-content"></div>
                </div>

                <button type="button" id="reset-btn" class="reset-btn">重新计算</button>
            </section>
        </main>

        <footer>
            <p>每日总能量消耗 = 基础代谢率 × 活动系数 + 食物热效应</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
